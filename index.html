<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイリンク集</title>
  <style>
    a {
    display: block;
    background: white;
    padding: 15px;
    text-align: center;
    border-radius: 10px;
    }
    img {
      width: 24px;
      height: 24px;
      margin-bottom: 5px;
    }
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
      margin-top: 20px;
    }
    a {
      display: block;
      background: white;
      padding: 15px;
      text-align: center;
      text-decoration: none;
      color: black;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    a:hover {
      background: #e0f0ff;
    }
  </style>
</head>
<body>

<h1>マイリンク集</h1>

<div class="grid">
  <a href="https://www.google.com">
    <img src="https://www.google.com/s2/favicons?domain=google.com">
    <br>Google
  </a>

  <a href="https://www.youtube.com">
    <img src="https://www.google.com/s2/favicons?domain=youtube.com">
    <br>YouTube
  </a>

  <a href="https://chat.openai.com">
    <img src="https://www.google.com/s2/favicons?domain=chat.openai.com">
    <br>ChatGPT
  </a>
</div>

</body>
</html>
