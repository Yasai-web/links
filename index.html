<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>リンク</title>

<style>
body {
  font-family: sans-serif;
  background: #f5f5f5;
  padding: 20px;
}

h1 {
  text-align: center;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 10px;
  margin-top: 20px;
}

a {
  display: block;
  background: white;
  padding: 15px;
  text-align: center;
  text-decoration: none;
  color: black;
  border-radius: 10px;
}

a:hover {
  background: #e0f0ff;
}

img {
  width: 24px;
  height: 24px;
  margin-bottom: 5px;
}
</style>
</head>

<body>

<h1>リンク</h1>

<div id="links" class="grid"></div>

<script>
fetch('links.json')
  .then(res => res.json())
  .then(data => {
    const container = document.getElementById('links');

    data.forEach(link => {
      const a = document.createElement('a');
      a.href = link.url;
      a.target = "_blank";

      const icon = document.createElement('img');

      // アイコン設定
      if (link.icon && link.icon.startsWith("http")) {
        icon.src = link.icon;
      } else {
        icon.src = "https://www.google.com/s2/favicons?domain=" + link.url;
      }

      // エラー時のフォールバック
      icon.onerror = () => {
        icon.src = "https://www.google.com/s2/favicons?domain=" + new URL(link.url).hostname;
      };

      const text = document.createElement('div');
      text.innerText = link.name;

      a.appendChild(icon);
      a.appendChild(text);
      container.appendChild(a);
    });
  });
</script>

</body>
</html>
