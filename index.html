<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>リンク</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: sans-serif; background: #f5f5f5; padding: 1.5rem; }

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.25rem;
  flex-wrap: wrap;
  gap: 8px;
}
.title { font-size: 18px; font-weight: 500; }

.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.pill {
  font-size: 12px;
  padding: 4px 12px;
  border-radius: 20px;
  border: 1px solid #ccc;
  background: white;
  color: #555;
  cursor: pointer;
}
.pill:hover { background: #f0f0f0; }
.pill.active { background: #CECBF6; border-color: #AFA9EC; color: #3C3489; }

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr); /* スマホ：3列固定 */
  gap: 8px;
}
@media (min-width: 480px) { .grid { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(5, 1fr); } }
@media (min-width: 800px) { .grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); } }

.card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 14px 8px;
  background: white;
  border: 1px solid #e0e0e0;
  border-radius: 12px;
  text-decoration: none;
  color: black;
  transition: background 0.15s;
}
.card:hover { background: #f5f5f5; }

.icon-wrap { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; }
.icon-wrap img { width: 26px; height: 26px; border-radius: 4px; object-fit: contain; }
.icon-fb {
  width: 26px; height: 26px;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 500;
}
.name { font-size: 12px; text-align: center; line-height: 1.3; }
</style>
</head>
<body>

<div class="header">
  <span class="title">リンク</span>
  <div class="filters" id="filters"></div>
</div>
<div class="grid" id="grid"></div>

<script>
const links = [
  { name: "Google",      url: "https://www.google.com",                           category: "検索", domain: "google.com" },
  { name: "ChatGPT",     url: "https://chat.openai.com",                          category: "AI",   domain: "chat.openai.com" },
  { name: "Claude",      url: "https://claude.ai",                                category: "AI",   domain: "claude.ai" },
  { name: "Gemini",      url: "https://gemini.google.com",                        category: "AI",   domain: "gemini.google.com" },
  { name: "NotebookLM",  url: "https://notebooklm.google.com",                    category: "AI",   domain: "notebooklm.google.com" },
  { name: "AI Studio",   url: "https://aistudio.google.com",                      category: "AI",   domain: "aistudio.google.com" },
  { name: "YouTube",     url: "https://www.youtube.com",                          category: "娯楽", domain: "youtube.com" },
  { name: "Notion",      url: "https://www.notion.so",                            category: "日常", domain: "notion.so" },
  { name: "Google Keep", url: "https://keep.google.com",                          category: "日常", domain: "keep.google.com" },
  { name: "Dropbox",     url: "https://www.dropbox.com",                          category: "日常", domain: "dropbox.com" },
  { name: "カフェ英会話",  url: "https://www.cafe-eikaiwa.jp",                    category: "学習", domain: "cafe-eikaiwa.jp" },
  { name: "ミッキーハウス",url: "https://www.mickeyhouse.jp",                     category: "学習", domain: "mickeyhouse.jp" },
  { name: "Meetup",      url: "https://www.meetup.com",                           category: "学習", domain: "meetup.com" },
  { name: "キッズルーム",  url: "https://www.city.bunkyo.lg.jp/b022/p001660.html",category: "子ども",domain: "city.bunkyo.lg.jp" },
  { name: "Amazon",      url: "https://www.amazon.co.jp",                         category: "生活", domain: "amazon.co.jp" },
  { name: "楽天",         url: "https://www.rakuten.co.jp",                       category: "生活", domain: "rakuten.co.jp" },
];

// カテゴリごとのフォールバックアイコンの色（背景色, 文字色）
const catColors = {
  "検索": ["#9FE1CB", "#085041"],
  "AI":   ["#B5D4F4", "#0C447C"],
  "娯楽": ["#FAC775", "#633806"],
  "日常": ["#C0DD97", "#27500A"],
  "学習": ["#F5C4B3", "#712B13"],
  "子ども":["#F4C0D1", "#72243E"],
  "生活": ["#D3D1C7", "#444441"],
};

// ドメインからファビコンURLを順番に生成する（wwwなしで渡すのがポイント）
function getFavSources(domain) {
  return [
    `https://t1.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=https://${domain}&size=64`,
    `https://www.google.com/s2/favicons?sz=64&domain=${domain}`,
    `https://icons.duckduckgo.com/ip3/${domain}.ico`,
    `https://${domain}/favicon.ico`,
    `https://www.${domain}/favicon.ico`,
  ];
}

// アイコン要素を作成（5段階フォールバック付き）
function buildIcon(link) {
  const wrap = document.createElement("div");
  wrap.className = "icon-wrap";
  const img = document.createElement("img");
  img.alt = link.name;

  const srcs = getFavSources(link.domain);
  let idx = 0;

  function tryNext() {
    if (idx < srcs.length) {
      img.src = srcs[idx++];
    } else {
      // すべて失敗 → 頭文字バッジを表示
      wrap.removeChild(img);
      const fb = document.createElement("div");
      fb.className = "icon-fb";
      const col = catColors[link.category] || ["#ddd", "#333"];
      fb.style.background = col[0];
      fb.style.color = col[1];
      fb.textContent = link.name[0].toUpperCase();
      wrap.appendChild(fb);
    }
  }

  img.onerror = tryNext;
  tryNext();
  wrap.appendChild(img);
  return wrap;
}

// カテゴリフィルター生成
let active = "すべて";
const cats = ["すべて", ...[...new Set(links.map(l => l.category))]];
const filtersEl = document.getElementById("filters");
const gridEl = document.getElementById("grid");

function render() {
  gridEl.innerHTML = "";
  const filtered = active === "すべて" ? links : links.filter(l => l.category === active);
  filtered.forEach(link => {
    const a = document.createElement("a");
    a.className = "card";
    a.href = link.url;
    a.target = "_blank";
    a.rel = "noopener";

    const nm = document.createElement("div");
    nm.className = "name";
    nm.textContent = link.name;

    a.appendChild(buildIcon(link));
    a.appendChild(nm);
    gridEl.appendChild(a);
  });
}

cats.forEach(cat => {
  const btn = document.createElement("button");
  btn.className = "pill" + (cat === active ? " active" : "");
  btn.textContent = cat;
  btn.onclick = () => {
    active = cat;
    document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    render();
  };
  filtersEl.appendChild(btn);
});

render();
</script>
</body>
</html>
