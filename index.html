<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リンク</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page-nav">
    <button class="page-tab active" data-page="main" onclick="switchPage('main')">リンク</button>
  </div>

  <!-- メインページ -->
  <div class="page active" id="page-main">
    <div class="header">
      <span class="title">リンク</span>
      <div class="filters" id="filters"></div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="seminar-link-wrap">
      <button class="seminar-link-btn" onclick="switchPage('seminar')">セミナー</button>
    </div>
  </div>

  <!-- セミナーページ -->
  <div class="page" id="page-seminar">
    <div class="header">
      <span class="title">セミナー</span>
      <button class="back-btn" onclick="switchPage('main')">← 戻る</button>
    </div>
    <!-- セクションはapp.jsが動的に生成 -->
    <div id="seminar-sections"></div>
  </div>

  <!-- データ定義（リンクの追加・編集はこのファイルで行う） -->
  <script src="links.js"></script>
  <!-- UIロジック -->
  <script src="app.js"></script>

</body>
</html>
